# ============================================
# DATABASE
# ============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://production-db-host:5432/taptrack_db}
spring.datasource.username=${DB_USERNAME:postgres_prod}
spring.datasource.password=${DB_PASSWORD:strong_password_here}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA / HIBERNATE
# ============================================
# validate: Chỉ kiểm tra cấu trúc bảng, KHÔNG tự động sửa/xóa bảng làm mất dữ liệu
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect