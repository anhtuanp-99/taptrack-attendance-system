spring.application.name=taptrack
server.port=8080

# === Active Profile ===
spring.profiles.active=local

# === Timezone ===
app.timezone=Asia/Ho_Chi_Minh

# === JWT ===
app.jwt.secret=${JWT_SECRET:change-me-this-must-be-at-least-32-bytes-long-key!!}
app.jwt.access-token-ttl-seconds=28800

# === Device API Key (giá trị mới) ===
app.device.api-key=TAPTRACK-ESP32-SECRET-KEY-2026

# === Grace period ===
attendance.grace-period-minutes=5

# === Jackson ===
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false

# === JPA ===
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# === Swagger ===
springdoc.swagger-ui.path=/swagger-ui.html

app.seed.enabled=true